# Optional: only used if this folder is a GitHub repo (e.g. hosted on GitHub Pages).
# Rebuilds nflverse.json + players.json a few times a day (every 30 min on game days) and commits it when the data changed.
name: Update nflverse data

on:
  schedule:
    # 14:00 UTC: after nflverse's morning refresh. 23:30 and 03:30 UTC: after the day's practice reports
    # (~4pm ET), so the by-day practice log catches each day if nflverse has updated. Unchanged data = no commit.
    - cron: '0 14 * * *'
    - cron: '30 23 * * *'
    - cron: '30 3 * * *'
    # Game days (Thu/Sun/Mon ET, i.e. into the next UTC day): every 30 min from late morning ET through the last
    # game, so injury news and inactives reach players.json quickly. Runs with no changes don't commit.
    - cron: '*/30 15-23 * * 0,1,4'
    - cron: '*/30 0-4 * * 1,2,5'
  workflow_dispatch:        # "Run workflow" button for a manual refresh

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python build_nflverse.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # only used to read when nflverse last updated injuries
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add nflverse.json players.json ros.json season.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update nflverse data" && git push; fi
