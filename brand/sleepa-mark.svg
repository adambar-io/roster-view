<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- sleepa mark (4a colors). Adapts to the browser's light/dark setting; used as the favicon. -->
  <style>
    .body{fill:#27272a}.ear{fill:#3f3f46}.visor{fill:#09090b}
    @media (prefers-color-scheme: dark){ .body{fill:#f4f4f5}.ear{fill:#d4d4d8}.visor{fill:#0e0e10} }
  </style>
  <defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter></defs>
  <rect class="body" x="64" y="10" width="26" height="80" rx="13" transform="rotate(-10 77 90)"/>
  <rect class="body" x="110" y="10" width="26" height="80" rx="13" transform="rotate(10 123 90)"/>
  <rect class="ear" x="71" y="22" width="12" height="50" rx="6" transform="rotate(-10 77 90)"/>
  <rect class="ear" x="117" y="22" width="12" height="50" rx="6" transform="rotate(10 123 90)"/>
  <circle class="body" cx="100" cy="122" r="62"/>
  <rect class="visor" x="50" y="100" width="100" height="42" rx="21"/>
  <g filter="url(#g)" fill="#2dd4bf"><ellipse cx="79" cy="121" rx="11" ry="8"/><ellipse cx="121" cy="121" rx="11" ry="8"/></g>
  <g fill="#a7f3d0"><ellipse cx="79" cy="121" rx="8" ry="5.5"/><ellipse cx="121" cy="121" rx="8" ry="5.5"/></g>
</svg>
